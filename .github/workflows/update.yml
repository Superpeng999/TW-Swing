name: TW Swing Market Data Update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tw-swing-market-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: TW_Swing_WebApp_V1
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Download project
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pull previous history from Supabase
        run: python supabase_bridge.py pull
      - name: Update official market data
        run: python pipeline.py --backfill-days 18
      - name: Persist official data and scores into Supabase
        run: python supabase_bridge.py push
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-swing-test-results
          path: TW_Swing_WebApp_V1/output/*.csv
          if-no-files-found: warn
          retention-days: 7
