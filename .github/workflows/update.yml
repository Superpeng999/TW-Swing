
name: TW Swing Market Data Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: TW_Swing_WebApp_V1

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update official market data
        run: |
          python pipeline.py --backfill-days 18

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tw-swing-test-results
          path: |
            TW_Swing_WebApp_V1/output/*.csv
          if-no-files-found: warn
          retention-days: 7
